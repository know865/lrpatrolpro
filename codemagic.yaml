workflows:
  android-release:
    name: LR Patrol Pro Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "hk.com.lrpatrolpro"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: 產生 Gradle Wrapper（如尚未存在）
        script: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew
      - name: 建置 Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace
      - name: 建置 Release APK（未簽章）
        script: |
          ./gradlew assembleRelease --stacktrace
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/logs/**/*.txt
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
