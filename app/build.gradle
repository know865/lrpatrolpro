plugins {
    id 'com.android.application'
}

android {
    namespace 'hk.com.lrpatrolpro'
    compileSdk 34

    defaultConfig {
        applicationId "hk.com.lrpatrolpro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    // 移除 androidx.webkit，改用 Android 內建 WebView 即可（App 不需要額外 WebKit）
    // implementation 'androidx.webkit:webkit:1.10.0'

    // 明確加入統一版本的 kotlin-stdlib，避免版本衝突
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
}

// ✅ 關鍵修正：強制所有 Kotlin 標準庫使用同一版本
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
        // 對舊版 jdk7/jdk8 做強制替換（Kotlin 1.8+ 已把它們合併到 kotlin-stdlib）
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin'
                    && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion '1.9.22'
            }
        }
    }
}
